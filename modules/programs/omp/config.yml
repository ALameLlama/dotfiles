providers:
  openai-codex:
    codeMode: "on"
  fetch: auto
codexResets:
  autoRedeem: "no"
claudeResets:
  autoRedeem: "no"
bash:
  allowCompoundCommands: false
steeringMode: one-at-a-time
tools:
  approvalMode: yolo
modelRoles:
  default: magpie/codex/gpt-6.1-sol:high
  smol: magpie/codex/gpt-6-luna:medium
  commit: magpie/codex/gpt-6-luna:low
  slow: magpie/codex/gpt-6.1-sol:auto
  judge: openrouter/~typesafe/jev-latest
symbolPreset: nerd
composer:
  shape: band
theme:
  dark: titanium
setupVersion: 3
modelPresets:
  GPT:
    modelRoles:
      default: magpie/codex/gpt-6.1-sol:high
      smol: magpie/codex/gpt-6-luna:medium
      commit: magpie/codex/gpt-6-luna:low
      slow: magpie/codex/gpt-6.1-sol:auto
      judge: openrouter/~typesafe/jev-latest
    defaultThinkingLevel: high
  DeepSeek:
    modelRoles:
      default: openrouter/~deepseek/deepseek-pro-latest:high
      smol: openrouter/~deepseek/deepseek-flash-latest:auto
      commit: openrouter/~deepseek/deepseek-flash-latest:low
      slow: openrouter/~deepseek/deepseek-pro-latest:auto
      judge: openrouter/~typesafe/jev-latest
    defaultThinkingLevel: high
defaultThinkingLevel: auto
dev:
  autoqaConsent: granted
edit:
  mode: hashline
astGrep:
  enabled: false
plan:
  defaultOnStartup: true